name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile server.py export_static.py tests/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Committed data parses
        run: |
          python - <<'PY'
          import json, pathlib, sys
          files = sorted(pathlib.Path("static/data").rglob("*.json"))
          if not files:
              sys.exit("static/data has no JSON files")
          for f in files:
              json.loads(f.read_text())
          print(f"{len(files)} data files parse")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Ruff is a CI-only tool; the app itself stays stdlib-only.
      - name: Ruff
        run: |
          python -m pip install ruff==0.16.8
          ruff check .
      - name: Check app.js syntax
        run: node --check static/app.js
